<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>緊急清掃のお願い</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
    .bgimg { position: fixed; inset: 0; background: url('/img/bg-respond.jpg') center/cover no-repeat; z-index: 0; }
    .bgimg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,12,24,.55), rgba(8,12,24,.92) 60%); }
    .wrap { position: relative; z-index: 1; width: min(460px, 100%); padding: 32px 16px 40px; }
    .top { text-align: center; margin-bottom: 18px; }
    .top .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; background: rgba(248,113,113,.25); color: #fecaca; font-weight: 700; font-size: 12px; letter-spacing: .05em; }
    .top h1 { font-size: 22px; margin: 10px 0 2px; }
    .big { font-size: 26px; font-weight: 700; margin: 2px 0; }
    .actions { display: grid; gap: 10px; margin-top: 18px; }
    .actions .btn { justify-content: center; padding: 14px; font-size: 15px; border-radius: 14px; }
    .result { text-align: center; padding: 18px 8px 4px; }
    .result .icon { font-size: 44px; }
  </style>
</head>
<body>
  <div class="bgimg" aria-hidden="true"></div>
  <div class="wrap">
    <div class="top"><span class="pill">CleanSync 緊急募集</span><h1 id="hello">読み込み中…</h1><p class="muted small" id="sub"></p></div>
    <div class="card" id="card"></div>
  </div>
  <script>
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const token = location.pathname.split('/r/')[1];
    const fmt = (iso) => new Date(iso).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    async function load() {
      const res = await fetch(`/api/respond/${token}`);
      const x = await res.json();
      if (!res.ok) {
        document.getElementById('hello').textContent = 'リンクが無効です';
        document.getElementById('card').innerHTML = `<p>${esc(x.error)}</p>`;
        return;
      }
      document.getElementById('hello').textContent = `${x.staffName} さん`;
      document.getElementById('sub').textContent = '直前予約が入りました。対応できるか教えてください（先着1名で確定）';
      const info = `
        <div class="muted small">施設</div><div class="big">${esc(x.property.name)}</div>
        <div class="small muted">${esc(x.property.address)}</div>
        <dl class="kv mt" style="font-size:14px">
          <dt>日時</dt><dd><b>${esc(x.cleaning.dateLabel)} ${esc(x.cleaning.startTime)}〜${esc(x.cleaning.endTime)}</b></dd>
          <dt>拘束時間</dt><dd>${x.cleaning.hours}時間</dd>
          <dt>次回チェックイン</dt><dd>${esc(x.property.checkinTime)}</dd>
          <dt>回答期限</dt><dd>${fmt(x.deadline)}</dd>
        </dl>
        ${x.exception ? '<p class="small" style="color:var(--warn)">※同日2件目の清掃になります</p>' : ''}`;
      let tail = '';
      if (x.status === 'filled') {
        tail = x.isMine
          ? '<div class="result"><div class="icon">✅</div><b>担当が確定しています</b><p class="small muted">ご対応ありがとうございます。AirHost にも登録済みです。</p></div>'
          : `<div class="result"><div class="icon">🙏</div><b>${esc(x.filledByName)} さんに決定しました</b><p class="small muted">ご確認ありがとうございました。</p></div>`;
      } else if (x.status === 'cancelled') {
        tail = '<div class="result"><div class="icon">—</div><b>この募集は終了しました</b></div>';
      } else if (x.myResponse === 'declined') {
        tail = '<div class="result"><b>「今回は難しい」で回答済みです</b><p class="small muted">気が変わった場合は下のボタンから承諾できます。</p></div><div class="actions"><button class="btn ok" data-a="accept">やっぱり対応できます</button></div>';
      } else {
        tail = '<div class="actions"><button class="btn ok" data-a="accept">対応できます</button><button class="btn" data-a="decline">今回は難しい</button></div>';
      }
      document.getElementById('card').innerHTML = info + tail;
    }

    document.addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-a]');
      if (!b) return;
      b.disabled = true;
      await fetch(`/api/respond/${token}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answer: b.dataset.a }) });
      load();
    });
    load();
  </script>
</body>
</html>
